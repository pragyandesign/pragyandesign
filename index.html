<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Portfolio under development. In the meantime, find Pragyan on Instagram.">
  <title>Portfolio under development | Pragyan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #fff;
      color: #111;
      font-family: "Sora", sans-serif;
    }
    main {
      width: min(100%, 1050px);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5.6vw, 56px);
      font-weight: 600;
      line-height: 1.22;
      letter-spacing: -0.055em;
    }
    a {
      color: #69b9f2;
      text-decoration: none;
      text-underline-offset: 6px;
    }
    a:hover, a:focus-visible {
      color: #369ce8;
      text-decoration: underline;
    }
    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 6px;
      border-radius: 2px;
    }
    @media (max-width: 480px) {
      body { padding: 22px; }
      h1 { font-size: clamp(28px, 8vw, 38px); }
    }
  </style>
</head>
<body>
  <main>
    <h1>
      Portfolio under development. Check back in a little while.
      In the meantime, I’ve started posting on
      <a href="https://www.instagram.com/pragyandesign/" target="_blank" rel="noopener noreferrer">Instagram</a>.
      Go have a look. Try not to make it weird.
    </h1>
  </main>
</body>
</html>
